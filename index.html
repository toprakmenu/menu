<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Toprak Bakery Menü</title>

<style>
body{
margin:0;
font-family:system-ui;
background:#f3f3f3;
}

/* HERO HEADER */
.hero{
position:relative;
width:100%;
height:320px;
overflow:hidden;
border-bottom-left-radius:22px;
border-bottom-right-radius:22px;
}

.hero__img{
position:absolute;
inset:0;
width:100%;
height:100%;
object-fit:cover;
}

.hero__overlay{
position:absolute;
inset:0;
background:linear-gradient(to bottom, rgba(0,0,0,.15), rgba(0,0,0,.55));
z-index:1;
}

.hero__topbar{
position:absolute;
top:12px;
left:14px;
z-index:3;
color:#fff;
font-weight:800;
padding:8px 12px;
border-radius:12px;
background:rgba(0,0,0,.25);
border:1px solid rgba(255,255,255,.25);
backdrop-filter:blur(8px);
}

.hero__content{
position:absolute;
left:16px;
right:16px;
bottom:18px;
z-index:3;
color:#fff;
}

.hero__pill{
display:inline-block;
padding:6px 10px;
border-radius:999px;
background:rgba(0,0,0,.35);
border:1px solid rgba(255,255,255,.25);
font-size:13px;
margin-bottom:10px;
}

.hero__title{
font-weight:1000;
font-size:36px;
line-height:1.05;
text-shadow:0 10px 30px rgba(0,0,0,.35);
}

.hero__subtitle{
margin-top:6px;
font-size:16px;
opacity:.92;
}

@media (max-width:420px){
.hero{height:280px;}
.hero__title{font-size:32px;}
}

/* GRID */
.grid{
padding:12px;
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

.card{
position:relative;
height:170px;
border-radius:14px;
overflow:hidden;
background:#ccc;
}

.card img{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
object-fit:cover;
}

.card span{
position:absolute;
bottom:10px;
left:10px;
color:white;
font-weight:900;
text-shadow:0 0 10px rgba(0,0,0,.7);
z-index:2;
}

.card::after{
content:"";
position:absolute;
inset:0;
background:linear-gradient(180deg, rgba(0,0,0,0) 40%, rgba(0,0,0,.6) 100%);
z-index:1;
}

.site-footer{
width:100%;
text-align:center;
padding:40px 0 60px;
color:#7a7a7a;
font-weight:800;
letter-spacing:.6px;
}
</style>
</head>

<body>

<header class="hero">

<div class="hero__topbar">🇹🇷 TR</div>

<img class="hero__img" src="images/header.webp" alt="Toprak Bakery House">

<div class="hero__overlay"></div>

<div class="hero__content">
<div class="hero__pill">İzmit</div>
<div class="hero__title">Toprak Bakery House</div>
<div class="hero__subtitle">Artizan Fırın - Kafe</div>
</div>

</header>

<div class="grid">

<img src="images/kahvaltı_cover.webp">
<span>KAHVALTI</span>
</a>

<span>TARTINE'LER (EKMEK ÜSTÜ)</span>
</a>

<a href="kruvasan_sandvic.html" class="card">
<img src="images/placeholder.png">

</a>

<a href="focaccia.html" class="card">
<img src="images/placeholder.png">
<span>FOCACCIA SANDVİÇLER</span>
</a>

<a href="kruvasanlar.html" class="card">

</a>

<a href="pogacalar.html" class="card">

<span>POĞAÇALAR</span>

<a href="tatlilar.html" class="card">
<img src="images/placeholder.png">

</a>

<a href="sporcumenusu.html" class="card">
<img src="images/placeholder.png">
<span>SPORCU MENÜSÜ</span>
</a>

<a href="sicakicecekler.html" class="card">
<img src="images/placeholder.png">
<span>SICAK İÇECEKLER</span>
</a>

<a href="sogukicecekler.html" class="card">
<img src="images/placeholder.png">

</div>

<footer class="site-footer">

</html>
