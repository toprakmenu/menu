<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Toprak Bakery Menü</title>

<style>
body{
margin:0;
font-family:system-ui;
background:#f3f3f3;
}

.topbar{
position:sticky;
top:0;
background:white;
padding:12px;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid #ddd;
z-index:10;
}

.grid{
padding:12px;
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

.card{
position:relative;
height:170px;
border-radius:14px;
overflow:hidden;
background:#ccc;
}

.card img{
width:100%;
height:100%;
object-fit:cover;
}

.card img{
width:100%;
height:100%;
object-fit:cover;
position:absolute;
top:0;
left:0;
}

.card span{
position:absolute;
bottom:10px;
left:10px;
color:white;
font-weight:900;
text-shadow:0 0 10px rgba(0,0,0,.7);
z-index:2;
}

.card::after{
content:"";
position:absolute;
inset:0;
background:linear-gradient(180deg, rgba(0,0,0,0) 40%, rgba(0,0,0,.6) 100%);
z-index:1;
}

.fab{
position:fixed;
right:20px;
bottom:20px;
width:60px;
height:60px;
background:red;
color:white;
border-radius:100%;
border:none;
font-size:28px;
}
 
.site-footer{
  width:100%;
  text-align:center;
  padding:40px 0 60px;
  color:#7a7a7a;
  font-weight:800;
  letter-spacing:.6px;
}
</style>
</head>
