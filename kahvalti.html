<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KAHVALTI</title>
  <style>
    :root{
      --bg:#f3f3f3;
      --card:#ffffff;
      --text:#111114;
      --muted:#6b7280;
      --line:#e2e2e2;
      --shadow:0 12px 26px rgba(0,0,0,.10);
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--text)}
    .top{
      position:sticky;top:0;z-index:10;
      background:#fff;border-bottom:1px solid var(--line);
      padding:12px 12px;
      display:flex;align-items:center;justify-content:space-between;gap:10px;
    }
    .back{color:var(--text);text-decoration:none;font-weight:800}
    .wrap{max-width:980px;margin:0 auto;padding:14px 12px 110px}
    h1{margin:6px 0 14px;font-size:20px}
    .grid{display:grid;gap:12px}
    .item{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:14px;
      overflow:hidden;
      box-shadow:var(--shadow);
      display:grid;
      grid-template-columns:110px 1fr;
      gap:12px;
      padding:10px;
      align-items:center;
      text-decoration:none;
      color:inherit;
      cursor:pointer;
    }
    .thumb{
      width:110px;height:90px;border-radius:12px;
      overflow:hidden;background:#ddd;
    }
    .thumb img{width:100%;height:100%;object-fit:cover;display:block}
    .name{font-weight:900;letter-spacing:.2px}
    .desc{color:var(--muted);font-size:13px;line-height:1.25;margin-top:4px}
    .price{margin-top:8px;font-weight:900}
    .hint{color:var(--muted);font-size:12px;margin-top:10px}

    /* Lightbox */
    .overlay{
      position:fixed;inset:0;
      background:rgba(0,0,0,.55);
      display:none;
      align-items:center;
      justify-content:center;
      padding:16px;
      z-index:50;
    }
    .overlay.open{display:flex}
    .modal{
      width:min(520px, 100%);
      background:#fff;
      border-radius:18px;
      overflow:hidden;
      box-shadow:0 24px 60px rgba(0,0,0,.35);
      position:relative;
    }
    .modalImg{width:100%;height:220px;background:#ddd}
    .modalImg img{width:100%;height:100%;object-fit:cover;display:block}
    .modalBody{padding:14px}
    .modalTitle{font-size:18px;font-weight:1000;margin:0}
    .modalDesc{margin:8px 0 0;color:var(--muted);line-height:1.35}
    .modalRow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}
    .modalPrice{font-size:18px;font-weight:1000}
    .btn{
      border:none;
      background:#111114;
      color:#fff;
      padding:12px 14px;
      border-radius:14px;
      font-weight:900;
      cursor:pointer;
      min-width:140px;
    }
    .x{
      position:absolute;top:10px;right:10px;
      width:40px;height:40px;border-radius:999px;
      border:1px solid rgba(255,255,255,.45);
      background:rgba(0,0,0,.35);
      color:#fff;font-size:18px;
      display:grid;place-items:center;
      cursor:pointer;
    }
  </style>
</head>
<body>

  <div class="top">
    <a class="back" href="index.html">← GERİ</a>
    <div style="font-weight:900">KAHVALTI</div>
    <div style="width:44px"></div>
  </div>

  <main class="wrap">
    <h1>KAHVALTI</h1>

    <div class="grid" id="list">
      <!-- TOPRAK GRANOLA -->
      <a class="item" data-name="TOPRAK GRANOLA" data-price="380"
         data-img="images/toprakgranola.webp"
         data-desc="El yapımı granola, süzme yoğurt, mevsim meyveleri ve yer fıstığı ezmesi. (Glutensiz-çiğ karabuğday granola seçeneği +40)">
        <div class="thumb"><img src="images/toprakgranola.webp" alt="Toprak Granola"></div>
        <div>
          <div class="name">TOPRAK GRANOLA</div>
          <div class="desc">El yapımı granola, süzme yoğurt, mevsim meyveleri ve yer fıstığı ezmesi</div>
          <div class="price">₺380</div>
        </div>
      </a>

      <!-- TOPRAK KAHVALTI -->
      <a class="item" data-name="TOPRAK KAHVALTI" data-price="420"
         data-img="images/toprakkahvalti.webp"
         data-desc="2 dilim ekşi mayalı ekmek, çırpılmış yumurta, domates, salatalık, zeytin, tereyağ, acuka, ezine peyniri, mevsim reçeli, yeşillik">
        <div class="thumb"><img src="images/toprakkahvalti.webp" alt="Toprak Kahvaltı"></div>
        <div>
          <div class="name">TOPRAK KAHVALTI</div>
          <div class="desc">2 dilim ekşi mayalı ekmek, çırpılmış yumurta, domates, salatalık…</div>
          <div class="price">₺420</div>
        </div>
      </a>
    </div>

    <div class="hint">Ürüne dokununca detay açılır.</div>
  </main>

  <!-- Lightbox -->
  <div class="overlay" id="overlay" aria-hidden="true">
    <div class="modal" role="dialog" aria-label="Ürün Detayı">
      <button class="x" id="closeBtn" aria-label="Kapat">✕</button>
      <div class="modalImg"><img id="mImg" alt=""></div>
      <div class="modalBody">
        <h2 class="modalTitle" id="mTitle"></h2>
        <p class="modalDesc" id="mDesc"></p>
        <div class="modalRow">
          <div class="modalPrice" id="mPrice"></div>
          <button class="btn" id="addBtn">SEPETE EKLE</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const overlay = document.getElementById("overlay");
    const closeBtn = document.getElementById("closeBtn");
    const mImg = document.getElementById("mImg");
    const mTitle = document.getElementById("mTitle");
    const mDesc = document.getElementById("mDesc");
    const mPrice = document.getElementById("mPrice");
    const addBtn = document.getElementById("addBtn");

    let currentItem = null;

    function openModal(item){
      currentItem = item;
      mImg.src = item.dataset.img;
      mImg.alt = item.dataset.name;
      mTitle.textContent = item.dataset.name;
      mDesc.textContent = item.dataset.desc;
      mPrice.textContent = "₺" + item.dataset.price;
      overlay.classList.add("open");
      overlay.setAttribute("aria-hidden","false");
    }
    function closeModal(){
      overlay.classList.remove("open");
      overlay.setAttribute("aria-hidden","true");
      currentItem = null;
    }

    document.querySelectorAll(".item").forEach(el=>{
      el.addEventListener("click",(e)=>{
        e.preventDefault();
        openModal(el);
      });
    });

    closeBtn.addEventListener("click", closeModal);
    overlay.addEventListener("click", (e)=>{ if(e.target === overlay) closeModal(); });
    document.addEventListener("keydown",(e)=>{ if(e.key === "Escape") closeModal(); });

    // Şimdilik sadece test: Sepete ekle butonu bildirim verir
    addBtn.addEventListener("click", ()=>{
      if(!currentItem) return;
      alert(currentItem.dataset.name + " sepete eklendi ✅ (demo)");
      closeModal();
    });
  </script>

</body>
</html>
