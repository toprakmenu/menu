<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KAHVALTI</title>

  <style>
    :root{
      --bg:#f3f3f3;
      --card:#ffffff;
      --text:#111114;
      --muted:#6b7280;
      --line:#e2e2e2;
      --gold:#caa24a; /* fiyat rengi */
      --shadow:0 18px 44px rgba(0,0,0,.18);
      --radius:18px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
      background:var(--bg);
      color:var(--text);
    }

    /* üst bar */
    .top{
      position:sticky; top:0; z-index:10;
      background:#fff;
      border-bottom:1px solid var(--line);
      padding:12px 12px;
      display:flex; align-items:center; justify-content:space-between;
      gap:10px;
    }
    .back{
      color:var(--text);
      text-decoration:none;
      font-weight:900;
    }

    .wrap{
      max-width:980px;
      margin:0 auto;
      padding:14px 12px 110px;
    }
    h1{margin:6px 0 14px;font-size:20px}

    /* liste kartları (sayfa içi) */
    .list{display:grid; gap:12px}
    .row{
      display:grid;
      grid-template-columns:110px 1fr;
      gap:12px;
      align-items:center;
      padding:10px;
      background:var(--card);
      border:1px solid var(--line);
      border-radius:14px;
      box-shadow:0 10px 24px rgba(0,0,0,.08);
      text-decoration:none;
      color:inherit;
      cursor:pointer;
    }
    .thumb{
      width:110px; height:90px;
      border-radius:12px;
      overflow:hidden;
      background:#ddd;
    }
    .thumb img{width:100%; height:100%; object-fit:cover; display:block}
    .name{font-weight:950; letter-spacing:.2px}
    .desc{margin-top:4px; color:var(--muted); font-size:13px; line-height:1.25}
    .price{margin-top:8px; font-weight:950}
    .hint{margin-top:10px; color:var(--muted); font-size:12px}

    /* POPUP / LIGHTBOX */
    .overlay{
      position:fixed; inset:0;
      background:rgba(0,0,0,.55);
      display:none;
      align-items:center;
      justify-content:center;
      padding:16px;
      z-index:50;
    }
    .overlay.open{display:flex}

    /* ekran görüntüsündeki gibi "kart" */
    .popupCard{
      width:min(560px, 100%);
      border-radius:22px;
      overflow:hidden;
      background:rgba(255,255,255,.95);
      box-shadow:var(--shadow);
      border:1px solid rgba(255,255,255,.35);
      position:relative;
    }

    .popupImage{
      width:100%;
      height:min(58vh, 420px);
      background:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:10px;
    }

    /* kırpma olmasın: contain */
    .popupImage img{
      width:100%;
      height:100%;
     object-fit:contain;
      display:block;
      border-radius:16px;
      background:#fff;
    }

    /* sağ üst X (yuvarlak, gold çerçeve hissi) */
    .closeBtn{
      position:absolute;
      top:12px; right:12px;
      width:46px; height:46px;
      border-radius:999px;
      border:2px solid rgba(202,162,74,.75);
      background:rgba(0,0,0,.45);
      color:#fff;
      font-size:22px;
      display:grid;
      place-items:center;
      cursor:pointer;
      backdrop-filter: blur(6px);
    }

    /* alt bar: isim solda fiyat sağda */
    .popupFooter{
      background:#fff;
      border-top:1px solid rgba(0,0,0,.06);
      padding:14px 16px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }
    .popupTitle{
      font-weight:950;
      font-size:20px;
      line-height:1.1;
    }
    .popupPrice{
      font-weight:1000;
      font-size:22px;
      color:var(--gold);
      white-space:nowrap;
    }

    /* açıklama (istersen açık kalsın) */
    .popupDesc{
      padding:0 16px 16px;
      color:var(--muted);
      font-size:14px;
      line-height:1.35;
      margin:0;
    }
  </style>
</head>

<body>
  <div class="top">
    <a class="back" href="index.html">← GERİ</a>
    <div style="font-weight:950">KAHVALTI</div>
    <div style="width:44px"></div>
  </div>

  <main class="wrap">
    <h1>KAHVALTI</h1>

    <div class="list">
      <!-- TOPRAK GRANOLA -->
      <a class="row"
         data-name="Toprak Granola"
         data-price="380 TL"
         data-img="images/toprakgranola.webp"
         data-desc="El yapımı granola, süzme yoğurt, mevsim meyveleri ve yer fıstığı ezmesi. (Glutensiz-çiğ karabuğday granola seçeneği +40)">
        <div class="thumb"><img src="images/toprakgranola.webp" alt="Toprak Granola"></div>
        <div>
          <div class="name">Toprak Granola</div>
          <div class="desc">El yapımı granola, süzme yoğurt, mevsim meyveleri…</div>
          <div class="price">380 TL</div>
        </div>
      </a>

      <!-- TOPRAK KAHVALTI -->
      <a class="row"
         data-name="Toprak Kahvaltı"
         data-price="420 TL"
         data-img="images/toprakkahvalti.webp"
         data-desc="2 dilim ekşi mayalı ekmek, çırpılmış yumurta, domates, salatalık, zeytin, tereyağ, acuka, ezine peyniri, mevsim reçeli, yeşillik">
        <div class="thumb"><img src="images/toprakkahvalti.webp" alt="Toprak Kahvaltı"></div>
        <div>
          <div class="name">Toprak Kahvaltı</div>
          <div class="desc">2 dilim ekşi mayalı ekmek, çırpılmış yumurta…</div>
          <div class="price">420 TL</div>
        </div>
      </a>
    </div>

    <div class="hint">Ürüne dokununca fotoğraflı popup açılır.</div>
  </main>

  <!-- POPUP -->
  <div class="overlay" id="overlay" aria-hidden="true">
    <div class="popupCard" role="dialog" aria-label="Ürün Detayı">
      <button class="closeBtn" id="closeBtn" aria-label="Kapat">×</button>

      <div class="popupImage">
        <img id="pImg" alt="">
      </div>

      <div class="popupFooter">
        <div class="popupTitle" id="pTitle"></div>
        <div class="popupPrice" id="pPrice"></div>
      </div>

      <p class="popupDesc" id="pDesc"></p>
    </div>
  </div>

  <script>
    const overlay = document.getElementById("overlay");
    const closeBtn = document.getElementById("closeBtn");

    const pImg   = document.getElementById("pImg");
    const pTitle = document.getElementById("pTitle");
    const pPrice = document.getElementById("pPrice");
    const pDesc  = document.getElementById("pDesc");

    function openPopup(el){
      pImg.src = el.dataset.img;
      pImg.alt = el.dataset.name;

      pTitle.textContent = el.dataset.name;
      pPrice.textContent = el.dataset.price;
      pDesc.textContent  = el.dataset.desc || "";

      overlay.classList.add("open");
      overlay.setAttribute("aria-hidden","false");
    }

    function closePopup(){
      overlay.classList.remove("open");
      overlay.setAttribute("aria-hidden","true");
      pImg.src = "";
    }

    document.querySelectorAll(".row").forEach(el=>{
      el.addEventListener("click", (e)=>{
        e.preventDefault();
        openPopup(el);
      });
    });

    closeBtn.addEventListener("click", closePopup);
    overlay.addEventListener("click", (e)=>{ if(e.target === overlay) closePopup(); });
    document.addEventListener("keydown",(e)=>{ if(e.key === "Escape") closePopup(); });
  </script>
</body>
</html>
